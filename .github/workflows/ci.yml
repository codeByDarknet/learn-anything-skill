name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run validate
      - run: npm test
      - name: Smoke test the CLI
        shell: bash
        run: |
          node bin/cli.js --help
          node bin/cli.js --dir "$RUNNER_TEMP/skills" -y
          test -f "$RUNNER_TEMP/skills/learn/SKILL.md"
          node bin/cli.js list
